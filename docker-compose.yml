services:
  db:
    image: postgres:15
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=log_db

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/log_db
    ports:
      - "514:514/udp" # Syslog UDP
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80" # HTTP
      # - "443:443" # HTTPS (requires certs)
    depends_on:
      - backend

  log-cleaner:
    build: ./backend
    command: python db/retention_policy.py
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/log_db
      - PYTHONPATH=/app
    depends_on:
      - db
    restart: always
