services:
  db:
    image: postgres:15
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - VIEWERS_JSON=${VIEWERS_JSON}
      - INGEST_API_KEY_NAME=${INGEST_API_KEY_NAME}
    command: sh -c "while ! nc -z db 5432; do sleep 1; echo 'Waiting for DB...'; done; uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "514:514/udp" # Syslog UDP
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      target: appliance-prod
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  log-cleaner:
    build: ./backend
    command: python db/retention_policy.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/app
    depends_on:
      - db
    restart: always
